name: Update minfwm formula

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-minfwm-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tap
        uses: actions/checkout@v4

      - name: Update formula from latest stable release
        run: python3 .github/scripts/update_formula.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit formula update
        run: |
          if git diff --quiet -- Formula/minfwm.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: diff

      - name: Push formula update
        if: steps.diff.outputs.changed == 'true'
        run: |
          version="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Formula/minfwm.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/minfwm.rb
          git commit -m "chore: update minfwm to ${version}"
          git push
